<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>geoforge</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #05070d; --panel: rgba(14, 18, 30, 0.88); --line: #26304a; --text: #dfe6f5; --dim: #8a96b2; --accent: #8fb4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: linear-gradient(var(--bg), rgba(5, 7, 13, 0)); z-index: 3; flex-wrap: wrap; }
  header b { letter-spacing: 0.08em; color: var(--accent); }
  nav#crumbs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
  nav#crumbs a { color: var(--dim); text-decoration: none; padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16em; }
  nav#crumbs a:hover { color: var(--text); background: var(--line); }
  nav#crumbs a.here { color: var(--text); }
  nav#crumbs span { color: var(--line); }
  #searchbox { position: relative; flex: 0 1 22em; min-width: 12em; }
  #search { width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  #hits { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 60vh; overflow: auto; display: none; }
  #hits div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid rgba(38, 48, 74, 0.5); }
  #hits div:hover, #hits div.on { background: var(--line); }
  #hits small { color: var(--dim); margin-left: 6px; }
  aside { position: fixed; right: 12px; bottom: 12px; width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; z-index: 2; }
  aside h2 { margin: 0 0 2px; font-size: 18px; }
  aside .sub { color: var(--dim); font-size: 12px; word-break: break-all; margin-bottom: 8px; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; }
  aside dt { color: var(--dim); }
  aside dd { margin: 0; }
  aside .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  button, select { font: inherit; color: var(--text); background: #1a2238; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: #2c3c66; border-color: var(--accent); }
  .note { color: var(--dim); font-size: 12px; }
  aside h3 { margin: 10px 0 4px; font-size: 13px; color: var(--dim); font-weight: normal; }
  aside ul.finds { margin: 0; padding-left: 16px; font-size: 12px; }
  aside ul.finds a { color: #c79bff; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #labels div { position: absolute; transform: translate(8px, -50%); font-size: 11px; color: var(--text); text-shadow: 0 0 3px #000, 0 0 6px #000; white-space: nowrap; }
  #labels div.dim { color: var(--dim); }
  #tip { position: fixed; left: 12px; bottom: 12px; color: var(--dim); font-size: 12px; z-index: 2; max-width: calc(100vw - 360px); }
  #busy { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--dim); z-index: 2; display: none; }
  @media (max-width: 640px) { aside { max-height: 42vh; } #tip { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<header>
  <b>GEOFORGE</b>
  <nav id="crumbs"></nav>
  <div id="searchbox"><input id="search" type="search" placeholder="Search names, or type an address" autocomplete="off"><div id="hits"></div></div>
</header>
<aside id="panel"></aside>
<div id="tip"></div>
<div id="busy">working…</div>
<script type="module" src="/app.js"></script>
</body>
</html>
