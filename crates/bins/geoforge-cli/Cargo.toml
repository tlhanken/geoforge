[package]
name = "geoforge-cli"
description = "Geoforge v2 command line: new, generate, plan, status, export, import, render"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "geoforge-v2"
path = "src/main.rs"

[dependencies]
geoforge-core = { path = "../../libs/geoforge-core" }
geoforge-cosmos = { path = "../../libs/geoforge-cosmos" }
geoforge-store = { path = "../../libs/geoforge-store" }
geoforge-pipeline = { path = "../../libs/geoforge-pipeline" }
clap = { workspace = true }
serde_json = "1"
toml = "0.8"
