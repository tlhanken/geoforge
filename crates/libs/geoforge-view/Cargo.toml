[package]
name = "geoforge-view"
description = "Geoforge viewer: a universe directory's scenes by address, search and maps, served to a browser"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
geoforge-core = { path = "../geoforge-core" }
geoforge-cosmos = { path = "../geoforge-cosmos" }
geoforge-analysis = { path = "../geoforge-analysis" }
geoforge-almanac = { path = "../geoforge-almanac" }
geoforge-store = { path = "../geoforge-store" }
geoforge-pipeline = { path = "../geoforge-pipeline" }
image = { version = "0.24", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = "1"
tiny_http = "0.12"
