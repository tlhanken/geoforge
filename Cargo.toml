[profile.release]
lto = "fat"
codegen-units = 1

# Fast-building optimized profile for iterating on generators: cargo build --profile iter
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[workspace]
members = [
    "crates/bins/geoforge",
    "crates/libs/geoforge-core",
    "crates/libs/geoforge-surface",
    "crates/libs/geoforge-cosmos",
    "crates/libs/geoforge-store",
    "crates/libs/geoforge-pipeline",
    "crates/bins/geoforge-cli",
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.package]
rust-version = "1.85.0"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
