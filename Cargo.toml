[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
members = ["crates/bins/*", "crates/libs/geoforge-types", "crates/libs/geoforge-cosmology"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.package]
rust-version = "1.75.0"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
